<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>현장 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/jobs">현장관리</a>
        <div class="navbar-nav">
            <a class="nav-link active" href="/jobs">고객/현장</a>
            <a class="nav-link" href="/estimates">견적</a>
            <a class="nav-link" th:href="@{'/estimates/new?jobId=' + ${job.id}}">이 현장 견적 등록</a>
        </div>
    </div>
</nav>
<main class="container py-4">
    <div class="row g-4">
        <div class="col-12 col-lg-5">
            <div class="card p-4 shadow-sm h-100">
                <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
                    <div>
                        <div class="section-kicker">현장 정보</div>
                        <h1 class="h4 mb-1" th:text="${job.siteName}">현장명</h1>
                        <p class="text-muted mb-0" th:text="${job.customerName}">고객명</p>
                    </div>
                    <a class="btn btn-primary" th:href="@{'/estimates/new?jobId=' + ${job.id}}">견적 등록</a>
                </div>
                <dl class="detail-list mb-0">
                    <div>
                        <dt>연락처</dt>
                        <dd th:text="${#strings.isEmpty(job.contact) ? '-' : job.contact}">-</dd>
                    </div>
                    <div>
                        <dt>주소</dt>
                        <dd th:text="${#strings.isEmpty(job.address) ? '-' : job.address}">-</dd>
                    </div>
                    <div>
                        <dt>메모</dt>
                        <dd th:text="${#strings.isEmpty(job.memo) ? '메모 없음' : job.memo}">메모 없음</dd>
                    </div>
                </dl>
            </div>
        </div>
        <div class="col-12 col-lg-7">
            <div class="card p-4 shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <div class="section-kicker">진행 이력</div>
                        <h2 class="h5 mb-0">등록된 견적</h2>
                    </div>
                    <span class="text-muted small" th:text="'총 ' + ${#lists.size(estimates)} + '건'">총 0건</span>
                </div>
                <div th:if="${#lists.isEmpty(estimates)}" class="empty-panel">
                    아직 등록된 견적이 없습니다. 첫 견적을 바로 등록해 보세요.
                </div>
                <div th:unless="${#lists.isEmpty(estimates)}" class="vstack gap-3">
                    <a class="estimate-card" th:each="estimate : ${estimates}" th:href="@{'/estimates/' + ${estimate.id}}">
                        <div class="d-flex justify-content-between align-items-start gap-3">
                            <div>
                                <div class="fw-semibold" th:text="${#strings.isEmpty(estimate.title) ? '제목 없음' : estimate.title}">제목 없음</div>
                                <div class="text-muted small" th:text="${#temporals.format(estimate.createdAt, 'yyyy-MM-dd HH:mm')}">2026-03-28 18:00</div>
                            </div>
                            <span class="badge rounded-pill text-bg-primary" th:text="${estimate.progressStatus.label}">견적</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3 small text-muted">
                            <span th:text="'품목 ' + ${#lists.size(estimate.items)} + '개'">품목 0개</span>
                            <span th:text="${#numbers.formatInteger(estimate.totalAmount, 3, 'COMMA')} + ' 원'">0 원</span>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
