<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>견적 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/jobs">현장관리</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/jobs">고객/현장</a>
            <a class="nav-link" href="/estimates">견적</a>
            <a class="nav-link active" href="/estimates/new">견적 등록</a>
        </div>
    </div>
</nav>
<main class="container py-4">
    <div class="card p-3 shadow-sm">
        <div class="section-kicker">작업 등록</div>
        <h1 class="h5 mb-3">견적 등록</h1>
        <form method="post" action="/estimates" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">고객/현장 선택</label>
                <select class="form-select" name="jobId" required>
                    <option value="">현장을 선택하세요</option>
                    <option th:each="job : ${jobs}"
                            th:value="${job.id}"
                            th:text="${job.customerName + ' / ' + job.siteName}"
                            th:selected="${selectedJobId != null and selectedJobId == job.id}"></option>
                </select>
            </div>
            <div class="row g-2">
                <div class="col-md-6">
                    <label class="form-label">견적 제목</label>
                    <input class="form-control" name="title" placeholder="예: 주방 리모델링 1차 견적">
                </div>
                <div class="col-md-6">
                    <label class="form-label">진행 상태</label>
                    <select class="form-select" name="progressStatus">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s.name() == 'QUOTE'}"></option>
                    </select>
                </div>
            </div>

            <div class="mt-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label class="form-label mb-0">견적 품목/금액</label>
                    <button class="btn btn-sm btn-outline-secondary" type="button" id="add-item-row">품목 추가</button>
                </div>
                <div id="estimate-items">
                    <div class="row g-2 mb-2 estimate-item-row" th:each="i : ${#numbers.sequence(1,3)}">
                        <div class="col-7 col-md-8"><input class="form-control" name="itemName" placeholder="품목명"></div>
                        <div class="col-5 col-md-4"><input class="form-control" name="amount" type="number" min="0" placeholder="금액"></div>
                    </div>
                </div>
                <div class="form-text">빈 품목은 자동으로 저장되지 않습니다.</div>
            </div>

            <div class="mt-3">
                <label class="form-label">사진 업로드</label>
                <input class="form-control" name="photos" type="file" multiple accept="image/*">
            </div>

            <div class="mt-3">
                <label class="form-label">메모</label>
                <textarea class="form-control" name="note" rows="3"></textarea>
            </div>

            <button class="btn btn-primary mt-3 w-100">등록하기</button>
        </form>
    </div>
</main>
<template id="estimate-item-template">
    <div class="row g-2 mb-2 estimate-item-row">
        <div class="col-7 col-md-8"><input class="form-control" name="itemName" placeholder="품목명"></div>
        <div class="col-5 col-md-4 d-flex gap-2">
            <input class="form-control" name="amount" type="number" min="0" placeholder="금액">
            <button class="btn btn-outline-danger remove-item-row" type="button">삭제</button>
        </div>
    </div>
</template>
<script>
    const addItemButton = document.getElementById('add-item-row');
    const itemContainer = document.getElementById('estimate-items');
    const itemTemplate = document.getElementById('estimate-item-template');

    addItemButton.addEventListener('click', () => {
        itemContainer.appendChild(itemTemplate.content.cloneNode(true));
    });

    itemContainer.addEventListener('click', (event) => {
        if (!event.target.classList.contains('remove-item-row')) {
            return;
        }

        const row = event.target.closest('.estimate-item-row');
        if (row) {
            row.remove();
        }
    });
</script>
</body>
</html>
