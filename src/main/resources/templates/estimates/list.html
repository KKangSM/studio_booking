<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>견적 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/jobs">현장관리</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/jobs">고객/현장</a>
            <a class="nav-link active" href="/estimates">견적</a>
            <a class="nav-link" href="/estimates/new">견적 등록</a>
        </div>
    </div>
</nav>
<main class="container py-4">
    <div class="card p-3 shadow-sm">
        <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mb-3">
            <div>
                <div class="section-kicker">진행 현황</div>
                <h1 class="h5 mb-0">견적 목록</h1>
            </div>
            <form class="d-flex flex-wrap gap-2" method="get" action="/estimates">
                <input class="form-control" name="keyword" th:value="${keyword}" placeholder="고객명, 현장명, 제목 검색">
                <select class="form-select" name="status">
                    <option value="">전체 상태</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${status == s}"></option>
                </select>
                <button class="btn btn-outline-secondary">검색</button>
            </form>
        </div>
        <div class="table-responsive">
            <table class="table align-middle">
                <thead><tr><th>ID</th><th>고객</th><th>현장</th><th>상태</th><th>총금액</th><th></th></tr></thead>
                <tbody>
                <tr th:each="e : ${estimates}">
                    <td th:text="${e.id}"></td>
                    <td th:text="${e.job.customerName}"></td>
                    <td th:text="${e.job.siteName}"></td>
                    <td><span class="badge text-bg-primary" th:text="${e.progressStatus.label}"></span></td>
                    <td th:text="${#numbers.formatInteger(e.totalAmount, 3, 'COMMA')} + ' 원'"></td>
                    <td><a class="btn btn-sm btn-outline-primary" th:href="@{'/estimates/' + ${e.id}}">상세</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
